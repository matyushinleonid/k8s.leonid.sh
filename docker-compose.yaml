version: "3.9"
services:
  k8s:
    image: k8s.leonid.sh:latest
    container_name: k8s
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.hetzner:/root/.hetzner
      - ~/.kube:/root/.kube
      - ./:/root/k8s.leonid.sh
    command: sleep infinity
