apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: argocd
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      type: Opaque
      data:
        admin.password: "{{ `{{ .admin_password_hash }}` }}"
        admin.passwordMtime: "2025-01-01T00:00:00Z"
  data:
    - secretKey: admin_password_hash
      remoteRef:
        key: {{ required "externalSecrets.admin.lockboxSecretId is required" .Values.externalSecrets.admin.lockboxSecretId | quote }}
        property: admin-password-hash
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-repo-creds
  namespace: argocd
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: argocd-github-repo-creds
    creationPolicy: Merge
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: git
        url: {{ .Values.externalSecrets.github.repoCredentialsUrl | quote }}
        sshPrivateKey: "{{ `{{ .github_ssh_key }}` }}"
  data:
    - secretKey: github_ssh_key
      remoteRef:
        key: {{ required "externalSecrets.github.lockboxSecretId is required" .Values.externalSecrets.github.lockboxSecretId | quote }}
        property: github-ssh-key
