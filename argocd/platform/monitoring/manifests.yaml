apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-user: "{{ .grafana_admin_user }}"
        admin-password: "{{ .grafana_admin_password }}"
  data:
    - secretKey: grafana_admin_user
      remoteRef:
        key: e6qib21hrudo8gun0h48
        property: grafana-admin-user
    - secretKey: grafana_admin_password
      remoteRef:
        key: e6qib21hrudo8gun0h48
        property: grafana-admin-password
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-public-dns
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.leonid.sh
    external-dns.alpha.kubernetes.io/target: gateway.leonid.sh
spec:
  type: ExternalName
  externalName: gateway.leonid.sh
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: yc-clusterissuer
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: grafana.leonid.sh
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: grafana
      kind: ListenerSet
      sectionName: https
  hostnames:
    - grafana.leonid.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - grafana.leonid.sh
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
