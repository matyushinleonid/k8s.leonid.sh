name: k8s.leonid.sh
help: k8s.leonid.sh tools
version: 0.1.0

commands:
  - name: terraform
    help: Terraform commands
    commands:
      - name: init
        help: Initialize the Terraform working directory
      - name: plan
        help: Generate and show an execution plan
      - name: apply
        help: Build or change infrastructure
      - name: destroy
        help: Destroy Terraform-managed infrastructure
      - name: output
        help: Show output values

  - name: ansible
    help: Ansible playbooks
    commands:

      - name: init_control_plane
        help: Initialize the first Kubernetes control plane node
        flags:
          - long: --public-ipv6
            arg: PUBLIC_IPV6
            help: "Public IPv6 address"
            required: true
          - long: --internal-ipv4
            arg: INTERNAL_IPV4
            help: "Internal IPv4 address"
            required: true
          - long: --hostname
            arg: HOSTNAME
            help: "Hostname (default: ctrl-001)"
            default: "ctrl-001"

      - name: join_ctrl
        help: Join an additional control plane node
        flags:
          - long: --public-ipv6
            arg: PUBLIC_IPV6
            help: "Public IPv6 address"
            required: true
          - long: --internal-ipv4
            arg: INTERNAL_IPV4
            help: "Internal IPv4 address"
            required: true
          - long: --hostname
            arg: HOSTNAME
            help: "Hostname"
            required: true
          - long: --existing-ctrl-public-ipv6
            arg: EXISTING_CTRL_PUBLIC_IPV6
            help: "Existing control plane's public IPv6 address"
            required: true

      - name: join_worker
        help: Join a worker node
        flags:
          - long: --public-ipv6
            arg: PUBLIC_IPV6
            help: "Public IPv6 address"
            required: true
          - long: --internal-ipv4
            arg: INTERNAL_IPV4
            help: "Internal IPv4 address"
            required: true
          - long: --hostname
            arg: HOSTNAME
            help: "Hostname"
            required: true
          - long: --existing-ctrl-public-ipv6
            arg: EXISTING_CTRL_PUBLIC_IPV6
            help: "Existing control plane's public IPv6 address"
            required: true

      - name: join_load_balancer
        help: Join a load balancer node
        flags:
          - long: --public-ipv6
            arg: PUBLIC_IPV6
            help: "Public IPv6 address"
            required: true
          - long: --internal-ipv4
            arg: INTERNAL_IPV4
            help: "Internal IPv4 address"
            required: true
          - long: --hostname
            arg: HOSTNAME
            help: "Hostname"
            required: true
          - long: --existing-ctrl-public-ipv6
            arg: EXISTING_CTRL_PUBLIC_IPV6
            help: "Existing control plane's public IPv6 address"
            required: true
          - long: --worker-internal-ipv4
            arg: WORKER_INTERNAL_IPV4
            help: "Additional worker node IP(s) for HAProxy"
            repeatable: true
            required: false
