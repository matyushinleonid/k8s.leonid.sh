apiVersion: v1
kind: ConfigMap
metadata:
  name: dasein-config
  namespace: dasein-ist-endlich-bot
data:
  local.yaml: |
    check_if_user_allowed: false
    allowed_users: []
    dasein_bot:
      start: "Добро пожаловать в дазайн бот! Нажмите /help для получения помощи в использовании бота."
      about: "Dasein ist endlich bot by Leonid Matyushin. [GitHub](https://github.com/matyushinleonid/dasein-ist-endlich-bot). Мы открыты к вашим пулл реквестам"
      help: "Нажмите /begin чтобы начать заполнение анкеты. На основании ваших ответов бот будет оценивать, сколько дней вам осталось жить. Бот будет задавать вам вопросы о вашем здоровье и образе жизни. Если вы не хотите отвечать на какой-то вопрос - отправьте пустое сообщение. Для управления частотой оповещений нижмите /notification."
      default: "Ваша история ответов на вопросы анкеты пуста. Нажмите /begin чтобы начать заполнение анкеты."
      illegal: "Данное действие не разрешено. Нажмите /help для получения помощи в использовании бота."
      questions:
        - "Ваша дата рождения (ДД.MM.ГГГГ):"
        - "Ваш пол:"
        - "Ваш текущий рост в сантиметрах:"
        - "Ваш текущий вес в килограммах:"
        - "В какой стране/городе вы живёте:"
        - "Как часто вы едите свежие овощи и фрукты? (несколько раз в день/ежедневно/несколько раз в неделю/редко/никогда):"
        - "Как часто вы употребляете сладости, выпечку или сладкие напитки? (ежедневно/несколько раз в неделю/редко/никогда):"
        - "Как часто вы употребляете обработанное или жареное мясо (колбаса, сосиски, жареная курица, бекон)? (ежедневно/несколько раз в неделю/редко/никогда):"
        - "Как часто вы едите фаст-фуд или сильно обработанную пищу? (ежедневно/несколько раз в неделю/редко/никогда):"
        - "Как часто вы занимаетесь умеренной/интенсивной физической активностью (быстрая ходьба, велосипед, плавание, бег, тяжёлая атлетика, командные виды спорта, ...)? Уточните вид активности и частоту (например: велосипед, 2 раза в неделю по 30 минут):"
        - "Курите ли вы? Уточните тип вещества и частоту (например: табак, 1 пачка в день / раньше курил табак, бросил 3 года назад):"
        - "Употребляете ли вы алкогольные напитки? Уточните частоту и количество (например: вино, 2 бокала в неделю / пиво, 3 бутылки ежедневно):"
        - "Употребляете ли вы регулярно другие психоактивные вещества (например, психостимуляторы)? Уточните вещество и частоту употребления:"
        - "Есть ли у вас хронические заболевания, диагностированные врачом? Перечислите кратко, если есть:"
        - "Были ли у ваших ближайших родственников (родители, бабушки-дедушки, братья и сёстры) серьёзные заболевания (например, диабет, онкология, сердечно-сосудистые заболевания)? Уточните кратко заболевание и родственника:"
        - "Были ли в вашей семье случаи долголетия (родственники, жившие дольше 90 лет)? Уточните родственника и возраст:"
        - "Как бы вы описали основные источники стресса в вашей жизни? Выберите все подходящие варианты и уточните по желанию: (работа / учёба / семейные отношения / финансы / здоровье / другие)"
        - "Чувствуете ли вы себя подавленным или депрессивным на протяжении длительного времени (от нескольких недель и более)? Уточните частоту и примерную продолжительность таких периодов (например: раз в год по несколько недель):"
        - "Как вы оцениваете качество своего сна? Уточните продолжительность сна в среднем за ночь и укажите, часто ли испытываете проблемы с засыпанием или пробуждением ночью:"
        - "Какую работу вы выполняете в основном? (преимущественно физическая / преимущественно офисная или интеллектуальная / смешанная физическая и интеллектуальная / не работаю):"
      answer_max_length: 500
      openai_user_limit: 100
      days_left_message: "Осталось дней: %d"
      healthz_port: 8080
    openai:
      model: "gpt-4.1"
      dummy: false
      developer_message: >
        You are the open-source Telegram bot "Sein zum Tode" (https://github.com/matyushinleonid/dasein-ist-endlich-bot). 
        Do not use the pronoun "I" in your responses. If absolutely necessary, you may use "we", but it is preferable to 
        employ passive-voice or impersonal constructions. Respond in the same language the user has used in their previous 
        answers. Your task is to estimate how many days the user has left to live and to provide a brief explanation of how 
        that estimate was derived (without showing explicit arithmetic, just outline in general terms how each of the user's 
        answers influences the result). Aim for as much accuracy as possible (in particular, avoid overly optimistic estimates),
        and avoid "round" numbers such as exactly 365 or 10; instead, offer a more irregular, natural-looking figure.
    mongodb:
      uri: "mongodb+srv://cluster0.8ehou5o.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0"
      username: "matyushinleonid"
      database: "dasein_bot"
      collection: "dasein_bot"
      connect_timeout: 5
    redis:
      host: "redis"
      port: 6379
      db: 0
      ttl: 3600s
