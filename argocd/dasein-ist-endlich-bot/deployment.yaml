apiVersion: apps/v1
kind: Deployment
metadata:
  name: dasein-deployment
  namespace: dasein-ist-endlich-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dasein
  template:
    metadata:
      labels:
        app: dasein
    spec:
      containers:
        - name: dasein
          image: matyushinleonid/dasein-ist-endlich-bot:cea56a078bfe2fc261ddc437c0e3dea5ce6b3199
          imagePullPolicy: IfNotPresent
          command: ["/app/dasein-ist-endlich-bot", "listener", "--config-path", "/configs/local.yaml"]
          envFrom:
            - secretRef:
                name: dasein-secret
          volumeMounts:
            - name: config-volume
              mountPath: /configs
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: dasein-config
            items:
              - key: local.yaml
                path: local.yaml