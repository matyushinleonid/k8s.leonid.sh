              "expr": "100 * (1 - max(k8s_volume_available{k8s_namespace_name=\"monitoring\", k8s_pod_name=\"prometheus-kube-prometheus-stack-prometheus-0\", k8s_volume_name=\"prometheus-kube-prometheus-stack-prometheus-db\"}) / max(k8s_volume_capacity{k8s_namespace_name=\"monitoring\", k8s_pod_name=\"prometheus-kube-prometheus-stack-prometheus-0\", k8s_volume_name=\"prometheus-kube-prometheus-stack-prometheus-db\"}))",
              "legendFormat": "Prometheus used",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Prometheus disk used",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": [
        "platform",
        "storage"
      ],
