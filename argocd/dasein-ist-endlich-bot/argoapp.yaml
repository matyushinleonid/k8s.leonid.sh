apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dasein-ist-endlich-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
    targetRevision: HEAD
    path: argocd/dasein-ist-endlich-bot
    directory:
      exclude: 'argoapp.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: dasein-ist-endlich-bot