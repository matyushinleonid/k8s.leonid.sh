apiVersion: batch/v1
kind: CronJob
metadata:
  name: dasein-notifier
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.notifier.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dasein-ist-endlich-bot
            app.kubernetes.io/component: notifier
        spec:
          restartPolicy: OnFailure
          containers:
            - name: notifier
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - notifier
                - --config-path
                - /configs/local.yaml
              envFrom:
                - secretRef:
                    name: dasein-secret
              resources:
                {{- toYaml .Values.notifier.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /configs
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: dasein-config
                items:
                  - key: local.yaml
                    path: local.yaml
