apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cr.yandex/yc-marketplace/yandex-cloud/externaldns/chart
      chart: externaldns
      targetRevision: 0.5.1-b
      helm:
        valueFiles:
          - $values/argocd/platform/external-dns/values.yaml
    - repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
      targetRevision: HEAD
      path: argocd/platform/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: external-dns-externaldns
      jsonPointers:
        - /data/iamkeyfile.json
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
