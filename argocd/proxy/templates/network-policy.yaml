apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxy.containerPort }}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.proxy.deniedDestinations | nindent 14 }}
