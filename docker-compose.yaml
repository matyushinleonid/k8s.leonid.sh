version: "3.9"
services:
  k8s:
    image: k8s.leonid.sh:latest
    container_name: k8s
    build:
      context: ./docker
      dockerfile: Dockerfile
    environment:
      - TERRAFORM_CLOUD_TOKEN=${TERRAFORM_CLOUD_TOKEN}
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.kube:/root/.kube
      - ./:/root/k8s.leonid.sh
