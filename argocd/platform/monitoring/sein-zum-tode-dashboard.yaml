apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-sein-zum-tode-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sein-zum-tode.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (stage, outcome) (rate(sein_zum_tode_telegram_updates_total{namespace=\"sein-zum-tode\"}[5m]))", "legendFormat": "{{stage}} / {{outcome}}", "refId": "A"}],
          "title": "Telegram update throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (kind, outcome, error_kind) (rate(sein_zum_tode_telegram_deliveries_total{namespace=\"sein-zum-tode\"}[5m]))", "legendFormat": "{{kind}} / {{outcome}} / {{error_kind}}", "refId": "A"}],
          "title": "Telegram delivery outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, kind) (rate(sein_zum_tode_telegram_delivery_seconds_bucket{namespace=\"sein-zum-tode\"}[10m])))", "legendFormat": "p95 {{kind}}", "refId": "A"}],
          "title": "Telegram delivery latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (event, locale) (increase(sein_zum_tode_questionnaires_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "{{event}} / {{locale}}", "refId": "A"}],
          "title": "Questionnaire funnel",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [
            {"expr": "sum by (use_case, provider, outcome) (increase(sein_zum_tode_llm_requests_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "{{use_case}} / {{provider}} / {{outcome}}", "refId": "A"},
            {"expr": "sum by (provider, outcome) (increase(sein_zum_tode_death_predictions_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "prediction {{provider}} / {{outcome}}", "refId": "B"}
          ],
          "title": "LLM requests and predictions",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [
            {"expr": "sum by (kind, outcome, locale) (increase(sein_zum_tode_notification_schedules_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "schedule {{kind}} / {{outcome}} / {{locale}}", "refId": "A"},
            {"expr": "sum by (outcome, locale) (increase(sein_zum_tode_mortal_notifications_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "notification {{outcome}} / {{locale}}", "refId": "B"}
          ],
          "title": "Notification business outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 7, "w": 8, "x": 0, "y": 16},
          "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (kind, outcome) (increase(sein_zum_tode_payload_cleanups_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "{{kind}} / {{outcome}}", "refId": "A"}],
          "title": "Ephemeral payload cleanup",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 7, "w": 8, "x": 8, "y": 16},
          "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (event) (increase(sein_zum_tode_mortal_events_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "{{event}}", "refId": "A"}],
          "title": "Mortal lifecycle",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 7, "w": 8, "x": 16, "y": 16},
          "id": 9,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}},
          "targets": [{"expr": "sum by (locale, outcome) (increase(sein_zum_tode_broadcast_deliveries_total{namespace=\"sein-zum-tode\"}[$__range]))", "legendFormat": "{{locale}} / {{outcome}}", "refId": "A"}],
          "title": "Broadcast delivery",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "${loki}"},
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 23},
          "id": 10,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=\"sein-zum-tode\"} | json | user_id=~\"$user_id\"", "queryType": "range", "refId": "A"}],
          "title": "User path in Loki",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["sein-zum-tode", "business", "telegram"],
      "templating": {
        "list": [
          {"current": {}, "label": "Prometheus", "name": "datasource", "options": [], "query": "prometheus", "refresh": 1, "type": "datasource"},
          {"current": {}, "label": "Loki", "name": "loki", "options": [], "query": "loki", "refresh": 1, "type": "datasource"},
          {"current": {"text": ".*", "value": ".*"}, "label": "User ID regexp", "name": "user_id", "options": [], "query": ".*", "type": "textbox"}
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Sein zum Tode",
      "uid": "sein-zum-tode",
      "version": 1
    }
