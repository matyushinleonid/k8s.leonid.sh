---
- name: Join a worker node (no static inventory)
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    existing_ctrl_public_ipv6: "{{ existing_ctrl_public_ipv6 }}"
    public_ipv6: "{{ public_ipv6 }}"
    internal_ipv4: "{{ internal_ipv4 }}"
    hostname: "{{ hostname }}"

  tasks:
    - name: Add existing control plane to ephemeral inventory
      add_host:
        name: existing_cp
        ansible_host: "{{ existing_ctrl_public_ipv6 }}"
        ansible_user: root
        ansible_ssh_private_key_file: "~/.ssh/k8s.leonid.sh"

    - name: Add new worker node to ephemeral inventory
      add_host:
        name: new_worker
        ansible_host: "{{ public_ipv6 }}"
        ansible_user: root
        ansible_ssh_private_key_file: "~/.ssh/k8s.leonid.sh"

    - name: Get kubeadm join command from existing control plane
      command: kubeadm token create --print-join-command --ttl 0
      register: join_cmd_raw
      delegate_to: existing_cp

- name: Configure the new worker node
  hosts: new_worker
  gather_facts: false
  become: true

  vars:
    new_node_hostname: "{{ hostvars['localhost'].hostname }}"
    new_node_internal_ip: "{{ hostvars['localhost'].internal_ipv4 }}"
    base_join_cmd: "{{ hostvars['localhost'].join_cmd_raw.stdout }}"

  tasks:
    - name: Include common tasks
      import_tasks: common_tasks.yaml

    - name: Set KUBELET_EXTRA_ARGS in /etc/default/kubelet
      lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: "KUBELET_EXTRA_ARGS='--node-ip {{ new_node_internal_ip }}'"
        create: yes
        state: present

    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_already_joined

    - name: Join cluster
      command: >
        {{ base_join_cmd }}
        --node-name={{ new_node_hostname }}
      register: kubeadm_join
      ignore_errors: yes
      when: not worker_already_joined.stat.exists

    - name: Fail if join failed
      fail:
        msg: "Worker node join failed."
      when:
        - not worker_already_joined.stat.exists
        - kubeadm_join.rc != 0
