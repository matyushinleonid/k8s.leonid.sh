---
- name: Initialize the first Kubernetes control plane node (no static inventory)
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    public_ipv6: "{{ public_ipv6 }}"
    internal_ipv4: "{{ internal_ipv4 }}"
    hostname: "{{ hostname | default('ctrl-001') }}"

  tasks:
    - name: Add new control-plane node to in-memory inventory
      add_host:
        name: new_ctrl
        ansible_host: "{{ public_ipv6 }}"
        ansible_user: root
        ansible_ssh_private_key_file: "~/.ssh/k8s.leonid.sh"

- name: Run init tasks on the new control-plane node
  hosts: new_ctrl
  gather_facts: false
  become: true

  vars:
    node_hostname: "{{ hostvars['localhost'].hostname }}"
    node_public_ipv6: "{{ hostvars['localhost'].public_ipv6 }}"
    node_internal_ipv4: "{{ hostvars['localhost'].internal_ipv4 }}"

  tasks:
    - name: Include common tasks
      import_tasks: common_tasks.yaml

    - name: kubeadm init
      command: >
        kubeadm init
        --control-plane-endpoint=k8s.leonid.sh:6443
        --apiserver-advertise-address={{ node_internal_ipv4 }}
        --apiserver-cert-extra-sans={{ node_public_ipv6 }}
        --pod-network-cidr=192.168.0.0/16,fd00::/64
        --service-cidr=10.96.0.0/16,fd01::/108
        --node-name={{ node_hostname }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Fail if kubeadm init failed
      fail:
        msg: "kubeadm init failed."
      when: kubeadm_init.rc != 0

    - name: Create local .kube directory
      delegate_to: localhost
      run_once: true
      file:
        path: "{{ lookup('env','HOME') }}/.kube"
        state: directory
        mode: '0755'

    - name: Fetch admin.conf from the newly inited node
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ lookup('env','HOME') }}/.kube/hetzner.conf"
        flat: yes
      run_once: true

    - name: Replace the API server address in local kubeconfig with public IPv6
      delegate_to: localhost
      replace:
        path: "{{ lookup('env','HOME') }}/.kube/hetzner.conf"
        regexp: 'server: https?://.*:6443'
        replace: 'server: https://[{{ node_public_ipv6 }}]:6443'
      run_once: true

    - name: Display next steps
      debug:
        msg: >
          Kubernetes control plane has been initialized on {{ node_hostname }}.
          Kubeconfig is saved to ~/.kube/hetzner.conf.
          You can manually create a join token on {{ node_hostname }} if needed:
          "kubeadm token create --print-join-command --ttl 0"
