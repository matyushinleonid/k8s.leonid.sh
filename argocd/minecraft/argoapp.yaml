apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: minecraft
spec:
  project: default
  source:
    repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
    targetRevision: HEAD
    path: argocd/minecraft
    directory:
      exclude: 'argoapp.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft