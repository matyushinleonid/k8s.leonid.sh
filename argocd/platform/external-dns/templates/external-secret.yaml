{{- if .Values.externalSecret.lockboxSecretId }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-dns-yandex-credentials
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: external-dns-externaldns
    creationPolicy: Merge
  data:
    - secretKey: iamkeyfile.json
      remoteRef:
        key: {{ .Values.externalSecret.lockboxSecretId | quote }}
        property: authorized-key
{{- end }}
