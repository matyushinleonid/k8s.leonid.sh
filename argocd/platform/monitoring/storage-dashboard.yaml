apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-storage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  platform-storage-kubelet.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 75},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 10, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "editorMode": "code",
              "expr": "100 * (1 - max(kubelet_volume_stats_available_bytes{namespace=\"monitoring\", persistentvolumeclaim=\"storage-loki-stack-0\"}) / max(kubelet_volume_stats_capacity_bytes{namespace=\"monitoring\", persistentvolumeclaim=\"storage-loki-stack-0\"}))",
              "legendFormat": "Loki used",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Loki disk used",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 75},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 10, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "editorMode": "code",
              "expr": "100 * (1 - max(kubelet_volume_stats_available_bytes{namespace=\"monitoring\", persistentvolumeclaim=\"prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0\"}) / max(kubelet_volume_stats_capacity_bytes{namespace=\"monitoring\", persistentvolumeclaim=\"prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0\"}))",
              "legendFormat": "Prometheus used",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Prometheus disk used",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 75},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 10, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "single", "sort": "none"}
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "editorMode": "code",
              "expr": "100 * (1 - max(kubelet_volume_stats_available_bytes{namespace=\"minecraft\", persistentvolumeclaim=\"minecraft-data\"}) / max(kubelet_volume_stats_capacity_bytes{namespace=\"minecraft\", persistentvolumeclaim=\"minecraft-data\"}))",
              "legendFormat": "Minecraft used",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Minecraft disk used",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["platform", "storage", "kubelet"],
      "templating": {
        "list": [
          {
            "current": {},
            "label": "Prometheus",
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Platform persistent storage (kubelet)",
      "uid": "platform-storage-kubelet",
      "version": 1
    }
