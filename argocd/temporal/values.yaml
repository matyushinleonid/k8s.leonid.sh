server:
  enabled: true
  replicaCount: 2
  config:
    logLevel: "info"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgres.local:6432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres.local:6432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres
            secretKey: password
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"
    archival:
      history:
        state: "disabled"
      visibility:
        state: "disabled"
    namespaces:
      create: false
      namespace:
        - name: default
          retention: 3d
  metrics:
    annotations:
      enabled: true
    serviceMonitor:
      enabled: false
  frontend:
    replicaCount: 2
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
  history:
    replicaCount: 2
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1Gi
    podDisruptionBudget:
      minAvailable: 1
  matching:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
  worker:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
schema:
  useHelmHooks: false
  jobAnnotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  backoffLimit: 100
  ttlSecondsAfterFinished: 86400
shims:
  # Compatibility shims are only required for Temporal 1.29 and older.
  dockerize: false
  elasticsearchTool: false
web:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    minAvailable: 1
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: yc-clusterissuer
      external-dns.alpha.kubernetes.io/hostname: temporal.leonid.sh
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: temporal-web-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Temporal authentication required"
    hosts:
      - temporal.leonid.sh
    tls:
      - secretName: temporal-web-tls
        hosts:
          - temporal.leonid.sh
admintools:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
