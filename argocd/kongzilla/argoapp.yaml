apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kongzilla
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:matyushinleonid/kongzilla.git
      targetRevision: HEAD
      path: deploy/helm/kongzilla
      helm:
        valueFiles:
          - $values/argocd/kongzilla/values.yaml
    - repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kongzilla
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
