- name: Build yc profile arguments
  ansible.builtin.set_fact:
    yc_profile_args: "{{ ['--profile', yc_profile] if yc_profile | length > 0 else [] }}"

- name: Ensure bootstrap namespaces exist
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop:
    - "{{ argocd_namespace }}"
    - external-secrets

- name: Add Argo Helm repository
  kubernetes.core.helm_repository:
    name: "{{ argocd_chart_repo_name }}"
    repo_url: "{{ argocd_chart_repository }}"

- name: Configure Yandex Lockbox auth secret for External Secrets
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: yc-lockbox-auth
        namespace: external-secrets
      type: Opaque
      stringData:
        authorized-key: "{{ tf.external_secrets_service_account_key_json }}"
  no_log: true

- name: Install private Argo CD
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    release_name: argocd
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    chart_ref: "{{ argocd_chart_ref }}"
    chart_version: "{{ argocd_chart_version }}"
    wait: true
    wait_timeout: 10m
    values:
      configs:
        params:
          server.insecure: true
      server:
        extraArgs:
          - --insecure

- name: Wait for Argo Application CRD
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: argocd_application_crd
  until: argocd_application_crd.resources | length > 0
  retries: 30
  delay: 5

- name: Read Argo admin password hash from Lockbox
  ansible.builtin.command:
    argv: "{{ [yc_command] + yc_profile_args + ['lockbox', 'payload', 'get', '--id', tf.argocd_admin_lockbox_secret_id, '--format', 'json'] }}"
  register: argocd_admin_lockbox_payload
  changed_when: false
  no_log: true

- name: Read Argo GitHub deploy key from Lockbox
  ansible.builtin.command:
    argv: "{{ [yc_command] + yc_profile_args + ['lockbox', 'payload', 'get', '--id', tf.argocd_github_lockbox_secret_id, '--format', 'json'] }}"
  register: argocd_github_lockbox_payload
  changed_when: false
  no_log: true

- name: Start Lockbox entry maps
  ansible.builtin.set_fact:
    argocd_admin_lockbox_entries: {}
    argocd_github_lockbox_entries: {}
  no_log: true

- name: Parse Argo admin Lockbox entries
  ansible.builtin.set_fact:
    argocd_admin_lockbox_entries: "{{ argocd_admin_lockbox_entries | combine({item.key: item_value}) }}"
  loop: "{{ (argocd_admin_lockbox_payload.stdout | from_json).entries }}"
  vars:
    item_value: >-
      {{ item.text_value if item.text_value is defined else
         item.textValue if item.textValue is defined else
         item.value if item.value is defined else
         (item.binary_value | b64decode) if item.binary_value is defined else
         (item.binaryValue | b64decode) if item.binaryValue is defined else '' }}
  no_log: true

- name: Parse Argo GitHub Lockbox entries
  ansible.builtin.set_fact:
    argocd_github_lockbox_entries: "{{ argocd_github_lockbox_entries | combine({item.key: item_value}) }}"
  loop: "{{ (argocd_github_lockbox_payload.stdout | from_json).entries }}"
  vars:
    item_value: >-
      {{ item.text_value if item.text_value is defined else
         item.textValue if item.textValue is defined else
         item.value if item.value is defined else
         (item.binary_value | b64decode) if item.binary_value is defined else
         (item.binaryValue | b64decode) if item.binaryValue is defined else '' }}
  no_log: true

- name: Configure Argo admin password
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-secret
        namespace: "{{ argocd_namespace }}"
      stringData:
        admin.password: "{{ argocd_admin_lockbox_entries['admin-password-hash'] }}"
        admin.passwordMtime: "{{ argocd_admin_password_mtime }}"
  no_log: true

- name: Configure Argo Git repository credentials
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-github-repo-creds
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      stringData:
        type: git
        url: "{{ argocd_repo_creds_url }}"
        sshPrivateKey: "{{ argocd_github_lockbox_entries['github-ssh-key'] }}"
  no_log: true

- name: Apply bootstrap Applications with Terraform-derived values
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('ansible.builtin.template', item) | from_yaml }}"
  loop:
    - cert-manager-application.yaml.j2
    - external-dns-application.yaml.j2
    - ingress-nginx-application.yaml.j2
  no_log: true

- name: Wait for prerequisite Applications
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ argocd_namespace }}"
    name: "{{ item }}"
  register: prerequisite_application
  until: >-
    prerequisite_application.resources | length > 0 and
    (prerequisite_application.resources[0].status.sync.status | default('')) == 'Synced' and
    (prerequisite_application.resources[0].status.health.status | default('')) == 'Healthy'
  retries: 60
  delay: 10
  loop:
    - cert-manager
    - external-dns
    - ingress-nginx

- name: Apply root Argo Application
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'root-application.yaml.j2') | from_yaml }}"
