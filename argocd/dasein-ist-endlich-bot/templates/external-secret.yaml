apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dasein-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: dasein-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: {{ .Values.externalSecret.properties.telegramBotToken | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: {{ .Values.externalSecret.properties.openaiApiKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: {{ .Values.externalSecret.properties.mongoPassword | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
