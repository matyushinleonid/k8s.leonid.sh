server:
  enabled: true
  replicaCount: 2
  config:
    logLevel: "info"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "postgres.local:6432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres
            secretKey: password
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres.local:6432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgres
            secretKey: password
            maxConns: 5
            maxIdleConns: 5
            maxConnLifetime: "1h"
    archival:
      history:
        state: "disabled"
      visibility:
        state: "disabled"
    namespaces:
      create: false
      namespace:
        - name: default
          retention: 3d
  metrics:
    annotations:
      enabled: true
    serviceMonitor:
      enabled: false
  frontend:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/instance: temporal
            app.kubernetes.io/component: frontend
    service:
      type: ClusterIP
      annotations:
        external-dns.alpha.kubernetes.io/hostname: temporal.local
        external-dns.alpha.kubernetes.io/target: temporal-frontend.temporal.svc.cluster.local
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
  history:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/instance: temporal
            app.kubernetes.io/component: history
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1Gi
    podDisruptionBudget:
      minAvailable: 1
  matching:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/instance: temporal
            app.kubernetes.io/component: matching
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
  worker:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
            app.kubernetes.io/instance: temporal
            app.kubernetes.io/component: worker
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    podDisruptionBudget:
      minAvailable: 1
schema:
  useHelmHooks: false
  jobAnnotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  backoffLimit: 100
  ttlSecondsAfterFinished: null
shims:
  dockerize: false
  elasticsearchTool: false
web:
  enabled: true
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
          app.kubernetes.io/instance: temporal
          app.kubernetes.io/component: web
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    minAvailable: 1
  ingress:
    enabled: false
admintools:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
