{{- $defaultStation := index .Values.stations .Values.defaultStation -}}
apiVersion: v1
kind: Service
metadata:
  name: radio-public-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.host | quote }}
    external-dns.alpha.kubernetes.io/target: gateway.leonid.sh
spec:
  type: ExternalName
  externalName: gateway.leonid.sh
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: radio
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: yc-clusterissuer
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: {{ .Values.host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: radio-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radio
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: radio
      kind: ListenerSet
      sectionName: https
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
{{- range $name, $station := .Values.stations }}
        - method: GET
          path:
            type: Exact
            value: /{{ $station.mount }}
        - method: HEAD
          path:
            type: Exact
            value: /{{ $station.mount }}
{{- end }}
      backendRefs:
        - name: radio-icecast
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /{{ $defaultStation.mount }}
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radio-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: radio-stream
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radio
  timeout:
    http:
      requestTimeout: 0s
      maxStreamDuration: 0s
      streamIdleTimeout: 0s
