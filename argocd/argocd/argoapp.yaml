apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: "https://argoproj.github.io/argo-helm"
      chart: argo-cd
      targetRevision: "v2.14.9"
      helm:
        valueFiles:
          - "$values/argocd/argocd/values.yaml"
    - repoURL: "git@github.com:matyushinleonid/k8s.leonid.sh.git"
      targetRevision: HEAD
      ref: values