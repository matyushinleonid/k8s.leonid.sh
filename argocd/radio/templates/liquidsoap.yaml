{{- range $name, $station := .Values.stations }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radio-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "radio.labels" $ | nindent 4 }}
    app.kubernetes.io/name: radio-{{ $name }}
    app.kubernetes.io/component: source
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radio-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "radio.labels" $ | nindent 8 }}
        app.kubernetes.io/name: radio-{{ $name }}
        app.kubernetes.io/component: source
      annotations:
        checksum/config: {{ toJson (dict "station" $station "syncInterval" $.Values.objectStorage.syncIntervalSeconds) | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: initial-media-sync
          image: {{ $.Values.images.rclone | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export RCLONE_CONFIG_RADIO_ACCESS_KEY_ID="$(cat /credentials/access-key-id)"
              export RCLONE_CONFIG_RADIO_SECRET_ACCESS_KEY="$(cat /credentials/secret-access-key)"
              rclone sync \
                "radio:{{ $.Values.objectStorage.bucket }}/{{ $station.objectStoragePrefix }}" \
                /media \
                --include '*.mp3' \
                --fast-list \
                --log-level INFO
          env:
            {{- include "radio.rcloneEnvironment" $ | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /media
            - name: s3-credentials
              mountPath: /credentials
              readOnly: true
          resources:
            {{- toYaml $.Values.rclone.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: liquidsoap
          image: {{ $.Values.images.liquidsoap | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - /etc/liquidsoap/radio.liq
          env:
            - name: ICECAST_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio-s3
                  key: icecast-source-password
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
            - name: liquidsoap-config
              mountPath: /etc/liquidsoap
              readOnly: true
          resources:
            {{- toYaml $.Values.liquidsoap.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: media-sync
          image: {{ $.Values.images.rclone | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              while true; do
                export RCLONE_CONFIG_RADIO_ACCESS_KEY_ID="$(cat /credentials/access-key-id)"
                export RCLONE_CONFIG_RADIO_SECRET_ACCESS_KEY="$(cat /credentials/secret-access-key)"
                if ! rclone sync \
                  "radio:{{ $.Values.objectStorage.bucket }}/{{ $station.objectStoragePrefix }}" \
                  /media \
                  --include '*.mp3' \
                  --fast-list \
                  --log-level INFO; then
                  echo "Media synchronization failed; keeping the existing cache" >&2
                fi
                sleep {{ $.Values.objectStorage.syncIntervalSeconds }}
              done
          env:
            {{- include "radio.rcloneEnvironment" $ | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /media
            - name: s3-credentials
              mountPath: /credentials
              readOnly: true
          resources:
            {{- toYaml $.Values.rclone.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: media
          emptyDir:
            sizeLimit: {{ $.Values.objectStorage.cacheSizeLimit }}
        - name: liquidsoap-config
          configMap:
            name: {{ $station.configMapName }}
        - name: s3-credentials
          secret:
            secretName: radio-s3
---
{{- end }}
