apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-data
spec:
  capacity:
    storage: {{ .Values.storage.capacity }}
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.storage.storageClassName }}
  claimRef:
    namespace: minecraft
    name: minecraft-data
  csi:
    driver: disk-csi-driver.mks.ycloud.io
    fsType: ext4
    volumeHandle: {{ required "storage.diskId is required" .Values.storage.diskId | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: {{ .Values.storage.storageClassName }}
  volumeName: minecraft-data
  resources:
    requests:
      storage: {{ .Values.storage.capacity }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papermc-secret
  namespace: minecraft
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: papermc-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        RCON_PASSWORD: "{{ `{{ .rcon_password }}` }}"
  data:
    - secretKey: rcon_password
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: rcon-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: papermc-config
  namespace: minecraft
data:
  EULA: "TRUE"
  TYPE: "PAPER"
  VERSION: "26.1.2"
  ONLINE_MODE: "FALSE"
  ENABLE_WHITELIST: "TRUE"
  MAX_PLAYERS: "5"
  ENABLE_RCON: "TRUE"
  RCON_PORT: "25575"
  INIT_MEMORY: "2G"
  MAX_MEMORY: "4G"
  MOTD: "\u00A7c\u00A7l«Киркой по голове»\u00A7r\nСервер имени Михаила Горшенёва"
  ICON: "https://storage.yandexcloud.net/leonid.sh/minecraft/server-icon.png"
  OVERRIDE_ICON: "TRUE"
  MODE: "survival"
  DIFFICULTY: "hard"
  SPAWN_PROTECTION: "0"
  VIEW_DISTANCE: "16"
  SIMULATION_DISTANCE: "8"
  STOP_SERVER_ANNOUNCE_DELAY: "30"
  MODRINTH_PROJECTS: "authmerereloaded,essentialsx,luckperms,chunky,bluemap"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bluemap-config
  namespace: minecraft
data:
  core.conf: |
    accept-download: true
    render-thread-count: {{ .Values.bluemap.renderThreadCount }}
  webserver.conf: |
    enabled: false
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen {{ .Values.bluemap.port }};
        root /data/bluemap/web;

        location = /healthz {
          access_log off;
          return 204;
        }

        location /maps/ {
          gzip_static always;

          location ~* ^/maps/[^/]*/tiles/ {
            error_page 404 = @empty;
          }
        }

        location @empty {
          return 204;
        }

        location / {
          try_files $uri $uri/ =404;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: papermc
  namespace: minecraft
spec:
  type: ClusterIP
  selector:
    app: papermc
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25565
    - name: bluemap
      protocol: TCP
      port: {{ .Values.bluemap.port }}
      targetPort: {{ .Values.bluemap.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-public-dns
  namespace: minecraft
  annotations:
    external-dns.alpha.kubernetes.io/hostname: minecraft.leonid.sh
    external-dns.alpha.kubernetes.io/target: gateway.leonid.sh
spec:
  type: ExternalName
  externalName: gateway.leonid.sh
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-map-public-dns
  namespace: minecraft
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.bluemap.host | quote }}
    external-dns.alpha.kubernetes.io/target: gateway.leonid.sh
spec:
  type: ExternalName
  externalName: gateway.leonid.sh
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: minecraft
      port: 25565
      protocol: TCP
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: minecraft
  namespace: minecraft
spec:
  parentRefs:
    - name: minecraft
      kind: ListenerSet
      sectionName: minecraft
  rules:
    - backendRefs:
        - name: papermc
          port: 25565
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: minecraft-map
  namespace: minecraft
  annotations:
    cert-manager.io/cluster-issuer: yc-clusterissuer
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: {{ .Values.bluemap.host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: minecraft-map-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minecraft-map
  namespace: minecraft
spec:
  parentRefs:
    - name: minecraft-map
      kind: ListenerSet
      sectionName: https
  hostnames:
    - {{ .Values.bluemap.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: papermc
          port: {{ .Values.bluemap.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minecraft-map-http-redirect
  namespace: minecraft
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - {{ .Values.bluemap.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: papermc
  namespace: minecraft
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  serviceName: papermc
  replicas: 1
  selector:
    matchLabels:
      app: papermc
  template:
    metadata:
      labels:
        app: papermc
    spec:
      terminationGracePeriodSeconds: 120
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: bluemap-config
          configMap:
            name: bluemap-config
      initContainers:
        - name: configure-bluemap
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /data/plugins/BlueMap
              cp /config/core.conf /data/plugins/BlueMap/core.conf
              cp /config/webserver.conf /data/plugins/BlueMap/webserver.conf
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bluemap-config
              mountPath: /config
              readOnly: true
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.7.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: papermc-config
            - secretRef:
                name: papermc-secret
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "5Gi"
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          stdin: true
          tty: true
        - name: bluemap-web
          image: {{ .Values.bluemap.web.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: bluemap
              containerPort: {{ .Values.bluemap.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: bluemap-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            {{- toYaml .Values.bluemap.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: bluemap
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: bluemap
            initialDelaySeconds: 10
            periodSeconds: 30
