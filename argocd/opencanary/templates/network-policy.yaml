apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencanary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencanary.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opencanary.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.services.ssh.containerPort }}
        - protocol: TCP
          port: {{ .Values.services.telnet.containerPort }}
        - protocol: TCP
          port: {{ .Values.services.http.containerPort }}
        - protocol: TCP
          port: {{ .Values.services.redis.containerPort }}
  egress: []
