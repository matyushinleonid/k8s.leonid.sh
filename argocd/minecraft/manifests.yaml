apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: yc-network-ssd-retain-expand
provisioner: disk-csi-driver.mks.ycloud.io
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: network-ssd
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papermc-secret
  namespace: minecraft
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: papermc-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        RCON_PASSWORD: "{{ .rcon_password }}"
  data:
    - secretKey: rcon_password
      remoteRef:
        key: e6q7dr9jusl4saot0mkg
        property: rcon-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: papermc-config
  namespace: minecraft
data:
  EULA: "TRUE"
  TYPE: "PAPER"
  VERSION: "26.1.2"
  ONLINE_MODE: "FALSE"
  ENABLE_WHITELIST: "TRUE"
  ENABLE_RCON: "TRUE"
  RCON_PORT: "25575"
  INIT_MEMORY: "2G"
  MAX_MEMORY: "4G"
  MOTD: "\u00A7c\u00A7l«Киркой по голове»\u00A7r\nСервер имени Михаила Горшенёва"
  ICON: "https://storage.yandexcloud.net/leonid.sh/minecraft/server-icon.png"
  OVERRIDE_ICON: "TRUE"
  MODE: "survival"
  DIFFICULTY: "hard"
  SPAWN_PROTECTION: "0"
  VIEW_DISTANCE: "14"
  SIMULATION_DISTANCE: "9"
  STOP_SERVER_ANNOUNCE_DELAY: "30"
  MODRINTH_PROJECTS: "authmerereloaded,essentialsx,luckperms,chunky"
---
apiVersion: v1
kind: Service
metadata:
  name: papermc
  namespace: minecraft
spec:
  type: ClusterIP
  selector:
    app: papermc
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-public-dns
  namespace: minecraft
  annotations:
    external-dns.alpha.kubernetes.io/hostname: minecraft.leonid.sh
    external-dns.alpha.kubernetes.io/target: gateway.leonid.sh
spec:
  type: ExternalName
  externalName: gateway.leonid.sh
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  parentRef:
    name: public
    namespace: envoy-gateway-system
  listeners:
    - name: minecraft
      port: 25565
      protocol: TCP
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: minecraft
  namespace: minecraft
spec:
  parentRefs:
    - name: minecraft
      kind: ListenerSet
      sectionName: minecraft
  rules:
    - backendRefs:
        - name: papermc
          port: 25565
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: papermc
  namespace: minecraft
spec:
  serviceName: papermc
  replicas: 1
  selector:
    matchLabels:
      app: papermc
  template:
    metadata:
      labels:
        app: papermc
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.7.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: papermc-config
            - secretRef:
                name: papermc-secret
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "5Gi"
          readinessProbe:
            exec:
              command: ["mc-health"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          stdin: true
          tty: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: yc-network-ssd-retain-expand
        resources:
          requests:
            storage: 10Gi
