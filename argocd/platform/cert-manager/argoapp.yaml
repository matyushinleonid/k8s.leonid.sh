apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cr.yandex/yc-marketplace/yandex-cloud/cert-manager-webhook-yandex
      chart: cert-manager-webhook-yandex
      targetRevision: 1.0.9
      helm:
        valueFiles:
          - $values/argocd/platform/cert-manager/values.yaml
    - repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:matyushinleonid/k8s.leonid.sh.git
      targetRevision: HEAD
      path: argocd/platform/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  ignoreDifferences:
    - kind: Secret
      name: cm-sa-creds
      jsonPointers:
        - /data/key.json
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /spec/duration
    - group: external-secrets.io
      kind: ExternalSecret
      name: cert-manager-yandex-credentials
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
