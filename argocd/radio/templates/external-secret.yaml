apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radio-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radio.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: yc-lockbox
    kind: ClusterSecretStore
  target:
    name: radio-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        access-key-id: '{{ `{{ $credentials := .s3Yaml | fromYaml }}{{ $credentials.access_key.key_id }}` }}'
        secret-access-key: '{{ `{{ $credentials := .s3Yaml | fromYaml }}{{ $credentials.secret }}` }}'
        icecast-source-password: '{{ `{{ $credentials := .s3Yaml | fromYaml }}{{ printf "radio-source:%s" $credentials.secret | sha256sum }}` }}'
        icecast-relay-password: '{{ `{{ $credentials := .s3Yaml | fromYaml }}{{ printf "radio-relay:%s" $credentials.secret | sha256sum }}` }}'
        icecast-admin-password: '{{ `{{ $credentials := .s3Yaml | fromYaml }}{{ printf "radio-admin:%s" $credentials.secret | sha256sum }}` }}'
  data:
    - secretKey: s3Yaml
      remoteRef:
        key: {{ required "objectStorage.lockboxSecretId is required" .Values.objectStorage.lockboxSecretId | quote }}
        property: {{ required "objectStorage.lockboxProperty is required" .Values.objectStorage.lockboxProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
