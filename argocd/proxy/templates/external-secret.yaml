apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxy-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: proxy-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        users: |
          {{ `{{ printf "%s %s" .login .password }}` }}
  data:
    - secretKey: login
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: {{ required "externalSecret.loginProperty is required" .Values.externalSecret.loginProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: {{ required "externalSecret.lockboxSecretId is required" .Values.externalSecret.lockboxSecretId | quote }}
        property: {{ required "externalSecret.passwordProperty is required" .Values.externalSecret.passwordProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
